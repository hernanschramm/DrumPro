<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1f2937"/>
      <stop offset="100%" style="stop-color:#111827"/>
    </linearGradient>
    <linearGradient id="stick" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f97316"/>
      <stop offset="100%" style="stop-color:#ef4444"/>
    </linearGradient>
  </defs>
  <!-- Fondo -->
  <rect width="512" height="512" rx="80" fill="url(#bg)"/>
  <!-- Tambor -->
  <ellipse cx="256" cy="320" rx="120" ry="40" fill="#374151" stroke="#4b5563" stroke-width="4"/>
  <rect x="136" y="240" width="240" height="80" fill="#374151" stroke="#4b5563" stroke-width="4"/>
  <ellipse cx="256" cy="240" rx="120" ry="40" fill="#4b5563" stroke="#6b7280" stroke-width="4"/>
  <!-- Líneas del tambor -->
  <line x1="156" y1="260" x2="156" y2="310" stroke="#6b7280" stroke-width="2"/>
  <line x1="200" y1="265" x2="200" y2="315" stroke="#6b7280" stroke-width="2"/>
  <line x1="256" y1="268" x2="256" y2="318" stroke="#6b7280" stroke-width="2"/>
  <line x1="312" y1="265" x2="312" y2="315" stroke="#6b7280" stroke-width="2"/>
  <line x1="356" y1="260" x2="356" y2="310" stroke="#6b7280" stroke-width="2"/>
  <!-- Baquetas cruzadas -->
  <line x1="140" y1="120" x2="340" y2="230" stroke="url(#stick)" stroke-width="12" stroke-linecap="round"/>
  <line x1="372" y1="120" x2="172" y2="230" stroke="url(#stick)" stroke-width="12" stroke-linecap="round"/>
  <!-- Puntas de baquetas -->
  <circle cx="140" cy="120" r="10" fill="#fbbf24"/>
  <circle cx="372" cy="120" r="10" fill="#fbbf24"/>
  <!-- Texto DrumPro -->
  <text x="256" y="430" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="52" font-weight="900" fill="#f97316">DrumPro</text>
</svg>
