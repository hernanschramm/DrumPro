<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>DrumPro - Generador de Iconos</title>
  <style>
    body { font-family: sans-serif; background: #111827; color: white; padding: 20px; text-align: center; }
    canvas { border: 2px solid #374151; margin: 10px; border-radius: 20px; }
    button { background: #f97316; color: white; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; font-size: 16px; margin: 10px; }
    button:hover { background: #ea580c; }
    h1 { color: #f97316; }
    .info { color: #9ca3af; margin: 20px; }
  </style>
</head>
<body>
  <h1>🥁 DrumPro - Generador de Iconos</h1>
  <p class="info">Genera los iconos PNG para la app y para Google Play</p>
  
  <div>
    <canvas id="icon512" width="512" height="512"></canvas>
    <canvas id="icon192" width="192" height="192"></canvas>
    <canvas id="iconPlay" width="1024" height="500"></canvas>
  </div>
  
  <div>
    <button onclick="downloadIcon('icon512', 'icon-512.png')">Descargar 512x512</button>
    <button onclick="downloadIcon('icon192', 'icon-192.png')">Descargar 192x192</button>
    <button onclick="downloadIcon('iconPlay', 'feature-graphic.png')">Descargar Feature Graphic</button>
    <button onclick="downloadAll()">Descargar Todo</button>
  </div>
  
  <p class="info">Guarda los archivos en la carpeta <code>public/</code> del proyecto</p>

  <script>
    function drawIcon(canvas, size) {
      const ctx = canvas.getContext('2d');
      
      // Fondo
      const bgGrad = ctx.createLinearGradient(0, 0, size, size);
      bgGrad.addColorStop(0, '#1f2937');
      bgGrad.addColorStop(1, '#111827');
      
      // Esquinas redondeadas
      const radius = size * 0.15;
      ctx.beginPath();
      ctx.moveTo(radius, 0);
      ctx.lineTo(size - radius, 0);
      ctx.quadraticCurveTo(size, 0, size, radius);
      ctx.lineTo(size, size - radius);
      ctx.quadraticCurveTo(size, size, size - radius, size);
      ctx.lineTo(radius, size);
      ctx.quadraticCurveTo(0, size, 0, size - radius);
      ctx.lineTo(0, radius);
      ctx.quadraticCurveTo(0, 0, radius, 0);
      ctx.closePath();
      ctx.fillStyle = bgGrad;
      ctx.fill();
      
      // Tambor (elipse inferior)
      const cx = size / 2;
      const cy = size * 0.62;
      const rx = size * 0.23;
      const ry = size * 0.08;
      
      ctx.beginPath();
      ctx.ellipse(cx, cy + size * 0.08, rx, ry, 0, 0, Math.PI * 2);
      ctx.fillStyle = '#374151';
      ctx.fill();
      
      // Cuerpo del tambor
      ctx.beginPath();
      ctx.rect(cx - rx, cy - size * 0.08, rx * 2, size * 0.16);
      ctx.fillStyle = '#374151';
      ctx.fill();
      
      // Tapa del tambor
      ctx.beginPath();
      ctx.ellipse(cx, cy - size * 0.08, rx, ry, 0, 0, Math.PI * 2);
      ctx.fillStyle = '#4b5563';
      ctx.strokeStyle = '#6b7280';
      ctx.lineWidth = size * 0.008;
      ctx.fill();
      ctx.stroke();
      
      // Líneas decorativas del tambor
      ctx.strokeStyle = '#6b7280';
      ctx.lineWidth = size * 0.004;
      for (let i = -2; i <= 2; i++) {
        const x = cx + i * (rx * 0.35);
        ctx.beginPath();
        ctx.moveTo(x, cy - size * 0.04);
        ctx.lineTo(x, cy + size * 0.04);
        ctx.stroke();
      }
      
      // Baquetas cruzadas
      const stickGrad = ctx.createLinearGradient(0, 0, size, size);
      stickGrad.addColorStop(0, '#f97316');
      stickGrad.addColorStop(1, '#ef4444');
      
      ctx.strokeStyle = stickGrad;
      ctx.lineWidth = size * 0.023;
      ctx.lineCap = 'round';
      
      // Baqueta 1
      ctx.beginPath();
      ctx.moveTo(size * 0.27, size * 0.23);
      ctx.lineTo(size * 0.65, size * 0.45);
      ctx.stroke();
      
      // Baqueta 2
      ctx.beginPath();
      ctx.moveTo(size * 0.73, size * 0.23);
      ctx.lineTo(size * 0.35, size * 0.45);
      ctx.stroke();
      
      // Puntas de baquetas
      ctx.fillStyle = '#fbbf24';
      ctx.beginPath();
      ctx.arc(size * 0.27, size * 0.23, size * 0.02, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(size * 0.73, size * 0.23, size * 0.02, 0, Math.PI * 2);
      ctx.fill();
      
      // Texto (solo en feature graphic)
      if (size > 512) {
        ctx.fillStyle = '#f97316';
        ctx.font = `bold ${size * 0.1}px Arial Black, sans-serif`;
        ctx.textAlign = 'center';
        ctx.fillText('DrumPro', cx, size * 0.85);
        
        ctx.fillStyle = '#9ca3af';
        ctx.font = `${size * 0.035}px Arial, sans-serif`;
        ctx.fillText('Metrónomo Profesional para Bateristas', cx, size * 0.93);
      }
    }
    
    function downloadIcon(canvasId, filename) {
      const canvas = document.getElementById(canvasId);
      const link = document.createElement('a');
      link.download = filename;
      link.href = canvas.toDataURL('image/png');
      link.click();
    }
    
    function downloadAll() {
      downloadIcon('icon512', 'icon-512.png');
      setTimeout(() => downloadIcon('icon192', 'icon-192.png'), 500);
      setTimeout(() => downloadIcon('iconPlay', 'feature-graphic.png'), 1000);
    }
    
    // Dibujar todos los iconos al cargar
    window.onload = () => {
      drawIcon(document.getElementById('icon512'), 512);
      drawIcon(document.getElementById('icon192'), 192);
      drawIcon(document.getElementById('iconPlay'), 1024);
    };
  </script>
</body>
</html>
