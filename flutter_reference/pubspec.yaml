# DrumPro Academy - pubspec.yaml de referencia
# Copiar este contenido al pubspec.yaml de tu proyecto Flutter

name: drumpro_academy
description: Plataforma profesional de enseñanza de batería para Android
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.6
  
  # Estado y navegación
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3
  go_router: ^13.2.0
  
  # Backend
  supabase_flutter: ^2.3.4
  
  # Audio y video
  just_audio: ^0.9.36
  audio_session: ^0.1.18
  record: ^5.1.0
  camera: ^0.10.5+9
  video_player: ^0.10.25
  file_picker: ^6.1.1
  
  # Almacenamiento local (offline-first)
  drift: ^2.14.0
  sqlite3_flutter_libs: ^0.5.18
  shared_preferences: ^2.2.2
  path_provider: ^2.1.2
  
  # Notificaciones
  firebase_core: ^2.24.2
  firebase_messaging: ^14.7.10
  flutter_local_notifications: ^17.0.0
  
  # Utilidades
  intl: ^0.19.0
  uuid: ^4.3.3
  equatable: ^2.0.5
  json_annotation: ^4.8.1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  flutter_svg: ^2.0.9
  url_launcher: ^6.2.4
  share_plus: ^7.2.2
  image_picker: ^1.0.7
  permission_handler: ^11.3.0
  connectivity_plus: ^5.0.2
  device_info_plus: ^9.1.1
  
  # Gráficos
  fl_chart: ^0.66.0
  
  # Calendario
  table_calendar: ^3.0.9
  
  # Videollamada (evaluar plan gratuito)
  live_kit_client: ^1.1.3
  # o jitsi_meet_flutter_sdk: ^1.0.0
  
  # Foreground service (metrónomo en segundo plano)
  flutter_foreground_task: ^6.1.3
  
  # Wake lock (pantalla encendida en modo escenario)
  wakelock_plus: ^1.1.4
  
  # MIDI (baterías electrónicas)
  flutter_midi_command: ^0.4.12
  
  # Monetización
  in_app_purchase: ^3.0.10
  
  # Crash reporting
  firebase_crashlytics: ^3.4.9
  firebase_analytics: ^10.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.8
  riverpod_generator: ^2.3.9
  json_serializable: ^6.7.1
  drift_dev: ^2.14.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/sounds/
    - assets/fonts/
  
  # fonts:
  #   - family: CustomFont
  #     fonts:
  #       - asset: assets/fonts/CustomFont-Regular.ttf
